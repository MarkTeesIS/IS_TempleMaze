<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin:0;
    overflow:hidden;
    touch-action:none;
    background:transparent;
}

canvas {
    display:block;
}
</style>

</head>

<body>

<canvas id="game"></canvas>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Images

let maskImage = new Image();
maskImage.src = "images/mask.png";

let mummyImage = new Image();
mummyImage.src = "images/mummy.png";

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;


// Maze layout
// # = wall
// . = path

const maze = [

".#########.",
".#.......#.",
".####.##.#.",
"##.#...#.##",
"...#.###...",
"##.#...####",
".#.###.#.#.",
".#.......#.",
".#########."

];


const cell = 70;

const mazeWidth = maze[0].length * cell;
const mazeHeight = maze.length * cell;

const offsetX = (canvas.width - mazeWidth) / 2;
const offsetY = (canvas.height - mazeHeight) / 2;


// Player

let player = {

x: offsetX + (0 * cell) + cell/2,
y: offsetY + (4 * cell) + cell/2,
width:40,
height:50

};


let start = {
x:player.x,
y:player.y
};


// Finish

let finish = {

x: offsetX + (10 * cell) + cell/2,
y: offsetY + (4 * cell) + cell/2

};


let dragging=false;
let won=false;



// Draw

function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



// draw maze

for(let y=0;y<maze.length;y++){

for(let x=0;x<maze[y].length;x++){


if(maze[y][x]=="#"){


ctx.fillStyle="#321900";

ctx.fillRect(
offsetX+x*cell,
offsetY+y*cell,
cell,
cell
);



}

}

}


// finish

drawCenteredImage(
    mummyImage,
    finish.x,
    finish.y,
    	50,
	40
);


// player

drawCenteredImage(
    maskImage,
    player.x,
    player.y,
    	40,
	50
);



if(won){

ctx.fillStyle="gold";
ctx.font="45px Arial";

ctx.fillText(
"TEMPLE UNLOCKED",
canvas.width/2-220,
80
);

}


requestAnimationFrame(draw);

}



// Check collision

function checkCollision(){

let left = player.x - player.width / 2;
let right = player.x + player.width / 2;
let top = player.y - player.height / 2;
let bottom = player.y + player.height / 2;


    let startCol = Math.floor((left - offsetX) / cell);
    let endCol = Math.floor((right - offsetX) / cell);

    let startRow = Math.floor((top - offsetY) / cell);
    let endRow = Math.floor((bottom - offsetY) / cell);


    for(let y = startRow; y <= endRow; y++){

        for(let x = startCol; x <= endCol; x++){

            if(
                y >= 0 &&
                y < maze.length &&
                x >= 0 &&
                x < maze[y].length
            ){

                if(maze[y][x] == "#"){

                    reset();
                    return;

                }

            }

        }

    }


    // finish

// finish

let distance = Math.hypot(
    player.x - finish.x,
    player.y - finish.y
);


if(distance < 10){

    won = true;

    document.dispatchEvent(
        new KeyboardEvent(
            "keydown",
            {
                key:"W"
            }
        )
    );

}



}



// Reset

function reset(){

    player.x=start.x;
    player.y=start.y;

    dragging=false;

}



// Touch

canvas.addEventListener(
"pointerdown",
e=>{


let distance=Math.hypot(
e.clientX-player.x,
e.clientY-player.y
);


if(distance<80){

dragging=true;

}

});



canvas.addEventListener(
"pointermove",
e=>{


if(!dragging || won)return;


player.x=e.clientX;
player.y=e.clientY;


checkCollision();


});



canvas.addEventListener(
"pointerup",
()=>{

dragging=false;

});

function drawCenteredImage(image, x, y, width, height){

    ctx.drawImage(
        image,
        x - width/2,
        y - height/2,
        width,
        height
    );

}



draw();


</script>

</body>
</html>
