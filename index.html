<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

html, body {

    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: transparent;

}


canvas {

    display: block;
    width: 100%;
    height: 100%;

}

</style>

</head>


<body>

<canvas id="game"></canvas>


<script>


const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


// =====================
// Images
// =====================

let maskImage = new Image();
maskImage.src = "images/mask.png";


let mummyImage = new Image();
mummyImage.src = "images/mummy.png";



// =====================
// Canvas
// =====================

canvas.width = 1920;
canvas.height = 1080;



// =====================
// Maze
// =====================

const maze = [

    "#####################",
    "#......#......#.....#",
    "###.#####.###.#.###.#",
    "#...#.....#...#.#...#",
    "#.###.#####.#...#.###",
    "#.......#...#.#.#...#",
    "#####################"

];



// =====================
// Maze Position
// =====================

const cell = 70;


const mazeWidth = maze[0].length * cell;
const mazeHeight = maze.length * cell;


const offsetX = (canvas.width - mazeWidth) / 2;
const offsetY = (canvas.height - mazeHeight) / 2;




// =====================
// Player
// =====================

let player = {

    x: offsetX + (1 * cell) + cell / 2,
    y: offsetY + (1 * cell) + cell / 2,

    width: cell * 0.45,
    height: cell * 0.55

};


let start = {

    x: player.x,
    y: player.y

};




// =====================
// Finish
// =====================

let finish = {

    x: offsetX + (19 * cell) + cell / 2,
    y: offsetY + (5 * cell) + cell / 2

};




// =====================
// State
// =====================

let dragging = false;
let won = false;


let dragOffsetX = 0;
let dragOffsetY = 0;



// =====================
// Draw
// =====================

function draw(){


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );



    // Walls

    for(let y = 0; y < maze.length; y++){

        for(let x = 0; x < maze[y].length; x++){


            if(maze[y][x] == "#"){


                ctx.fillStyle = "#321900";


                ctx.fillRect(
                    offsetX + x * cell,
                    offsetY + y * cell,
                    cell,
                    cell
                );


            }

        }

    }



    // Mummy

    drawCenteredImage(
        mummyImage,
        finish.x,
        finish.y,
        cell * 0.7,
        cell * 0.6
    );



    // Mask

    drawCenteredImage(
        maskImage,
        player.x,
        player.y,
        cell * 0.55,
        cell * 0.65
    );



    requestAnimationFrame(draw);


}




// =====================
// Collision
// =====================

function checkCollision(){


    let left = player.x - player.width / 2;
    let right = player.x + player.width / 2;

    let top = player.y - player.height / 2;
    let bottom = player.y + player.height / 2;



    let startCol = Math.floor(
        (left - offsetX) / cell
    );


    let endCol = Math.floor(
        (right - offsetX) / cell
    );


    let startRow = Math.floor(
        (top - offsetY) / cell
    );


    let endRow = Math.floor(
        (bottom - offsetY) / cell
    );



    for(let y = startRow; y <= endRow; y++){


        for(let x = startCol; x <= endCol; x++){


            if(
                maze[y] &&
                maze[y][x] == "#"
            ){

                reset();
                return;

            }


        }

    }



    // Win

    let distance = Math.hypot(
        player.x - finish.x,
        player.y - finish.y
    );


    if(distance < 20 && !won){


        won = true;


        window.location.href =
        "?complete=" + Date.now();


    }


}




// =====================
// Reset
// =====================

function reset(){


    player.x = start.x;
    player.y = start.y;


    dragging = false;


}




// =====================
// Input conversion
// =====================

function getTouchPosition(e){


    let rect = canvas.getBoundingClientRect();


    return {

        x:
        (e.clientX - rect.left) *
        (canvas.width / rect.width),


        y:
        (e.clientY - rect.top) *
        (canvas.height / rect.height)

    };


}




// =====================
// Pointer Controls
// =====================

canvas.addEventListener(
"pointerdown",
e => {


    let pos = getTouchPosition(e);



    let distance = Math.hypot(
        pos.x - player.x,
        pos.y - player.y
    );



    if(distance < 100){


        dragging = true;


        dragOffsetX =
        player.x - pos.x;


        dragOffsetY =
        player.y - pos.y;


        canvas.setPointerCapture(
            e.pointerId
        );


    }


});




canvas.addEventListener(
"pointermove",
e => {


    if(!dragging || won)
    return;



    let pos = getTouchPosition(e);



    player.x =
    pos.x + dragOffsetX;


    player.y =
    pos.y + dragOffsetY;



    checkCollision();



});





canvas.addEventListener(
"pointerup",
e => {


    dragging = false;



    if(
        canvas.hasPointerCapture(
            e.pointerId
        )
    ){

        canvas.releasePointerCapture(
            e.pointerId
        );

    }


});





// =====================
// Touch fallback
// =====================

canvas.addEventListener(
"touchstart",
e => {


    let touch = e.touches[0];


    let pos = getTouchPosition(touch);



    let distance = Math.hypot(
        pos.x - player.x,
        pos.y - player.y
    );



    if(distance < 100){


        dragging = true;


        dragOffsetX =
        player.x - pos.x;


        dragOffsetY =
        player.y - pos.y;


    }


},
{
    passive:false
});




canvas.addEventListener(
"touchmove",
e => {


    if(!dragging || won)
    return;



    e.preventDefault();



    let touch = e.touches[0];


    let pos = getTouchPosition(touch);



    player.x =
    pos.x + dragOffsetX;


    player.y =
    pos.y + dragOffsetY;



    checkCollision();


},
{
    passive:false
});





canvas.addEventListener(
"touchend",
()=>{

    dragging = false;

});





// =====================
// Image helper
// =====================

function drawCenteredImage(
    image,
    x,
    y,
    width,
    height
){

    ctx.drawImage(
        image,
        x - width / 2,
        y - height / 2,
        width,
        height
    );

}




draw();


</script>

</body>
</html>
