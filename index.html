<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: transparent;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>

</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


// =====================
// Images
// =====================

let maskImage = new Image();
maskImage.src = "images/mask.png";

let mummyImage = new Image();
mummyImage.src = "images/mummy.png";


// =====================
// Canvas
// =====================

canvas.width = canvas.clientWidth;
canvas.height = canvas.clientHeight;


// =====================
// Maze Layout
// =====================

const maze = [

    "#####################",
    "#......#......#.....#",
    "###.#####.###.#.###.#",
    "#...#.....#...#.#...#",
    "#.###.#####.#...#.###",
    "#.......#...#.#.#...#",
    "#####################"

];


// =====================
// Maze Positioning
// =====================

const cell = 70;

const mazeWidth = maze[0].length * cell;
const mazeHeight = maze.length * cell;


const offsetX = (canvas.width - mazeWidth) / 2;
const offsetY = (canvas.height - mazeHeight) / 2;


// =====================
// Player
// =====================

let player = {

    x: offsetX + (1 * cell) + cell / 2,
    y: offsetY + (1 * cell) + cell / 2,

    width: cell * 0.45,
    height: cell * 0.55

};


let start = {

    x: player.x,
    y: player.y

};



// =====================
// Finish
// =====================

let finish = {

    x: offsetX + (19 * cell) + cell / 2,
    y: offsetY + (5 * cell) + cell / 2

};



// =====================
// Game State
// =====================

let dragging = false;
let won = false;



// =====================
// Draw
// =====================

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Draw walls

    for(let y = 0; y < maze.length; y++){

        for(let x = 0; x < maze[y].length; x++){

            if(maze[y][x] == "#"){

                ctx.fillStyle = "#321900";

                ctx.fillRect(
                    offsetX + x * cell,
                    offsetY + y * cell,
                    cell,
                    cell
                );

            }

        }

    }



    // Mummy

    drawCenteredImage(
        mummyImage,
        finish.x,
        finish.y,
        cell * 0.7,
        cell * 0.6
    );



    // Mask

    drawCenteredImage(
        maskImage,
        player.x,
        player.y,
        cell * 0.55,
        cell * 0.65
    );


    requestAnimationFrame(draw);

}



// =====================
// Collision
// =====================

function checkCollision(){

    let left = player.x - player.width / 2;
    let right = player.x + player.width / 2;

    let top = player.y - player.height / 2;
    let bottom = player.y + player.height / 2;


    let startCol = Math.floor((left - offsetX) / cell);
    let endCol = Math.floor((right - offsetX) / cell);

    let startRow = Math.floor((top - offsetY) / cell);
    let endRow = Math.floor((bottom - offsetY) / cell);



    for(let y = startRow; y <= endRow; y++){

        for(let x = startCol; x <= endCol; x++){

            if(
                y >= 0 &&
                y < maze.length &&
                x >= 0 &&
                x < maze[y].length
            ){

                if(maze[y][x] == "#"){

                    reset();
                    return;

                }

            }

        }

    }



    // Win

    let distance = Math.hypot(
        player.x - finish.x,
        player.y - finish.y
    );


    if(distance < 20 && !won){

        won = true;

        window.location.href =
        "?complete=" + Date.now();

    }

}



// =====================
// Reset
// =====================

function reset(){

    player.x = start.x;
    player.y = start.y;

    dragging = false;

}



// =====================
// Controls
// =====================

// =====================
// Controls
// =====================

let dragOffsetX = 0;
let dragOffsetY = 0;


canvas.addEventListener(
"pointerdown",
e => {

    let rect = canvas.getBoundingClientRect();

    let touchX = (e.clientX - rect.left) * (canvas.width / rect.width);
    let touchY = (e.clientY - rect.top) * (canvas.height / rect.height);


    let distance = Math.hypot(
        touchX - player.x,
        touchY - player.y
    );


    if(distance < 100){

        dragging = true;


        // Keep the point where the user grabbed the mask

        dragOffsetX = player.x - touchX;
        dragOffsetY = player.y - touchY;


        canvas.setPointerCapture(e.pointerId);

    }

});



canvas.addEventListener(
"pointermove",
e => {

    if(!dragging || won) return;


    let rect = canvas.getBoundingClientRect();


    let touchX = (e.clientX - rect.left) * (canvas.width / rect.width);
    let touchY = (e.clientY - rect.top) * (canvas.height / rect.height);



    player.x = touchX + dragOffsetX;
    player.y = touchY + dragOffsetY;


    checkCollision();

});



canvas.addEventListener(
"pointerup",
e => {

    dragging = false;

    canvas.releasePointerCapture(e.pointerId);

});



// =====================
// Image Helper
// =====================

function drawCenteredImage(
    image,
    x,
    y,
    width,
    height
){

    ctx.drawImage(
        image,
        x - width / 2,
        y - height / 2,
        width,
        height
    );

}



draw();

</script>

</body>
</html>
